[client]
remote_addr = "example.com:2333" # Necessary. The address of the server
user = "alice" # Necessary. Must exist in `[server.users]` of the server
key = "alice_secret" # Necessary. The key of the user
alias_bind = "127.0.0.1" # Optional. Host of the alias listeners `<alias_bind>:<remote_port>`. Default: "127.0.0.1"
prefer_ipv6 = false # Optional. Prefer IPv6 for local UDP sockets. Default: false
nodelay = true # Optional. TCP nodelay of data channels. Default: not changed
heartbeat_timeout = 40 # Optional. Default: 40
retry_interval = 1 # Optional. Max retry interval in secs. Default: 1

[client.transport]
type = "tcp" # Optional. Possible values: ["tcp", "tls", "noise", "websocket"]. Default: "tcp"

[client.transport.tls] # Necessary if `type` is "tls"
trusted_root = "ca.pem" # Necessary. The certificate of CA that signed the server's certificate
hostname = "example.com" # Optional. The hostname that the client uses to validate the certificate. If not set, fallback to `client.remote_addr`

[client.transport.noise] # Noise protocol. See `docs/transport.md` for further explanation
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s" # Optional. Default value as shown
local_private_key = "key_encoded_in_base64" # Optional
remote_public_key = "key_encoded_in_base64" # Optional

[server]
bind_addr = "0.0.0.0:2333" # Necessary. The address that the server listens for clients. Remote ports are bound on the same host
expose_bind = "127.0.0.1" # Optional. Host the allocated remote ports listen on. Default: host of `bind_addr`
alloc_file = "allocations.toml" # Optional. Persisted remote port allocations. Default: "allocations.toml", relative to this file
nodelay = true # Optional. TCP nodelay of data channels. Default: not changed
heartbeat_interval = 30 # Optional. Default: 30

[server.transport]
type = "tcp" # Same as `[client.transport]`

[server.transport.tls] # Necessary if `type` is "tls"
pkcs12 = "identify.pfx" # Necessary. pkcs12 file of server's certificate and private key
pkcs12_password = "password" # Necessary. Password of the pkcs12 file

[server.transport.noise] # Same as `[client.transport.noise]`
pattern = "Noise_NK_25519_ChaChaPoly_BLAKE2s"
local_private_key = "key_encoded_in_base64"
remote_public_key = "key_encoded_in_base64"

[server.users.alice] # One table per user. `alice` is the user name the client authenticates as
key = "alice_secret" # Necessary. Shared secret of the user
port_block = "20000-20999" # Necessary. Exclusive block of remote ports of this user. Blocks must not overlap
tcp = ["1081", "8000-8010"] # Optional. Local TCP ports of the client to expose. Each is "port" or "start-end"
udp = ["1082"] # Optional. Same for UDP

[server.nginx] # Optional. Keep an nginx `map` file in sync with the directory
map_file = "rathole.map" # Necessary. Relative to this file. Lines: `<local_port>.<user>.<domain> <remote_port>;`
domain = "example.com" # Necessary. Suffix of the generated host names
reload_cmd = "nginx -s reload" # Optional. Shell command run after the file changed
