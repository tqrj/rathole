[client]
user = "test"
key = "test_key"
remote_addr = "127.0.0.1:2333"

[client.transport]
type = "tls"
[client.transport.tls]
trusted_root = "examples/tls/rootCA.crt"
hostname = "localhost"

[server]
alloc_file = "../../target/alloc_tcp.toml"
bind_addr = "0.0.0.0:2333"

[server.transport]
type = "tls"
[server.transport.tls]
pkcs12 = "examples/tls/identity.pfx"
pkcs12_password = "1234"

[server.users.test]
key = "test_key"
port_block = "2334-2335"
tcp = ["8080", "8081"]
