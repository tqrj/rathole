name: Release

# 只在推送 tag（如 v0.5.0）或手动触发时构建；普通 commit 推送不会触发
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest # linux/amd64
            target: x86_64-unknown-linux-gnu
            exe: rathole
          - os: windows-latest # windows/amd64
            target: x86_64-pc-windows-msvc
            exe: rathole.exe
          - os: macos-latest # mac Apple Silicon
            target: aarch64-apple-darwin
            exe: rathole
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Zip
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a rathole-${{ matrix.target }}.zip ${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: rathole-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/rathole-${{ matrix.target }}.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/rathole-${{ matrix.target }}.zip
          generate_release_notes: true
