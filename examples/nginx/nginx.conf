# 放进 nginx 的 http {} 块。rathole 维护 rathole.map，nginx 只需 include 它
map $host $rathole_port {
    include /usr/local/openresty/nginx/conf/rathole.map; # 与 server.toml 里的 map_file 指向同一文件
    default 0;
}

server {
    listen 443 ssl http2;
    server_name *.example.com;
    ssl_certificate     /etc/nginx/wildcard.crt;
    ssl_certificate_key /etc/nginx/wildcard.key;

    location / {
        if ($rathole_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$rathole_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
