[server]
bind_addr = "0.0.0.0:2333"
alloc_file = "allocations.toml" # Optional. Persisted port allocation table. Default: "allocations.toml", relative to this file

# Users allowed to connect. Each gets an exclusive block of remote ports, and the
# server decides which local ports of the user's client get exposed.
[server.users.alice]
key = "alice_secret"
port_block = "20000-20999"
tcp = ["80", "8000-8010"] # Local ports of alice's machine. Remote ports are allocated in the block

[server.users.bob] # Exposes nothing. Only sees the directory and opens aliases
key = "bob_secret"
port_block = "21000-21999"
