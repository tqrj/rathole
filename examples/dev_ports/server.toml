# 服务端：客户端本地 5173-5200 在公网上原样映射到 5173-5200
# 分配规则是“按端口升序取块内最小空闲端口”，端口块与暴露范围一致时即为原样映射。
[server]
bind_addr = "0.0.0.0:2333"
alloc_file = "allocations.toml" # 可选，分配表持久化文件，重启后映射不变

# 用户 dev 独占远端端口块 5173-5200，暴露其本机 5173-5200
[server.users.dev]
key = "dev_secret"
port_block = "5173-5200"
tcp = ["5173-5200"] # 结果为 5173->5173 ... 5200->5200
